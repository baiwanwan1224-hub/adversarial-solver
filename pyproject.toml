[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-solver"
version = "0.1.2"
description = "Dual-LLM adversarial content generation — Generator produces, Critic reviews, loop until PASS."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Reforox Contributors"},
]
keywords = [
    "llm", "adversarial", "content-generation", "ai-writing",
    "dual-model", "quality-assurance", "tone-checker", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/baiwanwan1224-hub/adversarial-solver"
Repository = "https://github.com/baiwanwan1224-hub/adversarial-solver"
Issues = "https://github.com/baiwanwan1224-hub/adversarial-solver/issues"

[project.scripts]
adversarial-solver = "adversarial_solver.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/adversarial_solver"]

[tool.coverage.report]
fail_under = 60
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
